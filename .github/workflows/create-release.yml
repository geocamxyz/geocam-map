name: Create Release Tag

on:
  push:
    branches:
      - main
      - preview

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Classify prerelease vs stable (branch-aware)
        id: classify
        run: |
          VERSION="${{ steps.package_version.outputs.VERSION }}"
          BRANCH="${GITHUB_REF_NAME}"

          # If on preview branch, force prerelease + not latest.
          if [[ "$BRANCH" == "preview" ]]; then
            echo "PRERELEASE=true"  >> "$GITHUB_OUTPUT"
            echo "MAKE_LATEST=false" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false"  >> "$GITHUB_OUTPUT"
            echo "MAKE_LATEST=true"  >> "$GITHUB_OUTPUT"
          fi

          # Use the version exactly as the tag (no 'v' prefix)
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '${{ steps.classify.outputs.TAG }}';
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.setOutput('exists', 'true');
            } catch {
              core.setOutput('exists', 'false');
            }

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag_name = '${{ steps.classify.outputs.TAG }}';
            const name = `Release ${tag_name}`;
            const body = `Automated release for ${repo} ${tag_name}`;
            const prerelease = ${{ steps.classify.outputs.PRERELEASE }};
            const make_latest = '${{ steps.classify.outputs.MAKE_LATEST }}'; // "true" | "false" | "legacy"

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name,
              name,
              body,
              draft: false,
              prerelease,
              make_latest,
              target_commitish: context.sha
            });
          result-encoding: string

      # jsDelivr serves `@latest` through a mutable alias whose FILE cache does not
      # follow a new tag by itself. Twice now a correct release has sat invisible
      # behind stale bytes — the resolver API reported the new version while the CDN
      # kept returning the previous build, so a shipped fix never reached any viewer.
      # Purging the alias for each published file is what actually makes a release
      # live. Stable only: `@latest` does not move for a preview build.
      - name: Purge jsDelivr @latest cache
        if: steps.check_tag.outputs.exists == 'false' && steps.classify.outputs.MAKE_LATEST == 'true'
        run: |
          set -uo pipefail
          TAG="${{ steps.classify.outputs.TAG }}"

          if [ ! -d dist ]; then
            echo "No dist/ directory — nothing to purge."
            exit 0
          fi

          mapfile -t FILES < <(find dist -type f \
            \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.css' -o -name '*.map' \) \
            | sort)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No publishable files under dist/ — nothing to purge."
            exit 0
          fi

          # Give jsDelivr a moment to notice the tag the previous step just created,
          # so the purge does not simply re-cache the old build.
          sleep 15

          for f in "${FILES[@]}"; do
            echo "Purging /gh/${GITHUB_REPOSITORY}@latest/${f}"
            curl -fsS -m 60 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@latest/${f}" > /dev/null \
              || echo "::warning::Purge request failed for ${f}"
          done

          # Confirm the alias now serves the build we just tagged. Retried, because
          # propagation is not instant; failed rather than warned, because a release
          # that never reaches users is not a success and a warning in a green build
          # is exactly how this went unnoticed before.
          stale=""
          for attempt in 1 2 3; do
            stale=""
            for f in "${FILES[@]}"; do
              latest=$(curl -sL -m 60 -o /dev/null -w '%{size_download}' \
                "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@latest/${f}")
              tagged=$(curl -sL -m 60 -o /dev/null -w '%{size_download}' \
                "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${TAG}/${f}")
              if [ "$latest" != "$tagged" ]; then
                stale="${stale} ${f} (@latest ${latest}B vs @${TAG} ${tagged}B)"
              fi
            done
            [ -z "$stale" ] && break
            echo "Attempt ${attempt}: still stale —${stale}"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          if [ -n "$stale" ]; then
            echo "::error::@latest still serving stale content after purge:${stale}"
            echo "### jsDelivr purge FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@latest\` is still serving the previous build for:${stale}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### jsDelivr \`@latest\` purged and verified for ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${FILES[@]}" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
